name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      s3:
        # Pinned because it enforces request signing, which the tests rely on.
        image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        ports:
          - 9000:9000
    defaults:
      run:
        working-directory: unpub
    env:
      UNPUB_TEST_S3_ENDPOINT: localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --enforce-lockfile
      - run: dart analyze
      - run: dart format --set-exit-if-changed .
      - name: Wait for S3
        run: timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:9000; do sleep 1; done'
      - run: dart test
      - name: Lint the OpenAPI description
        working-directory: .
        # Pinned, as in the README; raise both together.
        run: npx --yes @redocly/cli@2.77.0 lint docs/openapi.yaml

  # The web client: lint, types, unit tests and the build.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Check that src/api/schema.d.ts matches docs/openapi.yaml
        run: npm run api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Bundle size
        run: |
          du -sh dist
          find dist/assets -name '*.js' -o -name '*.css' | xargs gzip -c | wc -c | awk '{printf "gzipped JS and CSS: %d KiB\n", $1/1024}'

  # The client served by the Dart server, in Chromium.
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: ui
    env:
      UNPUB_E2E_MONGO_URI: mongodb://localhost:27017/unpub_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Read the locked Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browsers come from the cache, the system libraries do not.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t unpub:ci .
      - name: Run the image
        run: |
          docker run --rm unpub:ci version
      - name: Check that the image holds the web client
        run: |
          # The runtime image is scratch, without a shell: copy the file out.
          id="$(docker create unpub:ci)"
          docker cp "$id:/app/ui/index.html" index.html
          docker rm "$id"
          grep -q '<div id="root">' index.html
          ! grep -Eq '<script>|<style|style="' index.html
