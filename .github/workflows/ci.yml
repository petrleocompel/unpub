name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      s3:
        # Pinned because it enforces request signing, which the tests rely on.
        image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        ports:
          - 9000:9000
    defaults:
      run:
        working-directory: unpub
    env:
      UNPUB_TEST_S3_ENDPOINT: localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --enforce-lockfile
      - run: dart analyze
      - run: dart format --set-exit-if-changed .
      - name: Wait for S3
        run: timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:9000; do sleep 1; done'
      - run: dart test
      - name: Lint the OpenAPI description
        working-directory: .
        # Pinned, as in the README; raise both together.
        run: npx --yes @redocly/cli@2.77.0 lint docs/openapi.yaml

  # The web client. Skipped until ui/package.json exists.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('ui/package.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: hashFiles('ui/package.json') != ''
        run: npm ci
      - if: hashFiles('ui/package.json') != ''
        run: npm run lint
      - if: hashFiles('ui/package.json') != ''
        run: npm run typecheck
      - if: hashFiles('ui/package.json') != ''
        run: npm test -- --run
      - if: hashFiles('ui/package.json') != ''
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t unpub:ci .
      - name: Run the image
        run: |
          docker run --rm unpub:ci version
