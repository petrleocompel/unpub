name: unpub
description: Self-hosted private Dart Pub server for Enterprise, with a simple web interface to search and view packages information.
version: 3.0.0-dev.2
homepage: https://github.com/petrleocompel/unpub
publish_to: none
environment:
  sdk: ^3.5.0
executables:
  unpub: unpub
dependencies:
  archive: ^4.6.0
  args: ^2.7.0
  collection: ^1.19.1
  crypto: ^3.0.7
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  mime: ^2.1.0
  minio: ^3.5.8
  mongo_dart: ^0.10.10
  path: ^1.9.1
  pointycastle: ^4.0.0
  pub_semver: ^2.2.1
  shelf: ^1.4.3
  shelf_cors_headers: ^0.1.5
  shelf_router: ^1.1.5
  yaml: ^3.1.4
dev_dependencies:
  async: ^2.13.1
  build_runner: ^2.16.2
  json_serializable: ^6.15.2
  lints: ^6.1.0
  shelf_router_generator: ^1.1.5
  test: ^1.33.0
