# Runs unpub with MongoDB. Configure it with an .env file next to this one:
#
#   UNPUB_AUTH_ADMIN_EMAIL=you@example.com
#   UNPUB_AUTH_ADMIN_PASSWORD=at-least-8-characters
#   UNPUB_SERVER_PUBLIC_URL=https://pub.example.com
services:
  unpub:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      UNPUB_MONGO_URI: mongodb://mongo:27017/dart_pub
      UNPUB_SERVER_PUBLIC_URL: ${UNPUB_SERVER_PUBLIC_URL:-http://localhost:4000}
      UNPUB_AUTH_ADMIN_EMAIL: ${UNPUB_AUTH_ADMIN_EMAIL:-}
      UNPUB_AUTH_ADMIN_PASSWORD: ${UNPUB_AUTH_ADMIN_PASSWORD:-}
      UNPUB_AUTH_BOOTSTRAP_TOKEN: ${UNPUB_AUTH_BOOTSTRAP_TOKEN:-}
      UNPUB_AUTH_BOOTSTRAP_EMAIL: ${UNPUB_AUTH_BOOTSTRAP_EMAIL:-admin@localhost}
      UNPUB_AUTH_READ_ACCESS: ${UNPUB_AUTH_READ_ACCESS:-public}
      UNPUB_AUTH_READ_TOKENS: ${UNPUB_AUTH_READ_TOKENS:-}
    volumes:
      - unpub-packages:/data/packages

  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mongo-data:/data/db

volumes:
  unpub-packages:
  mongo-data:
