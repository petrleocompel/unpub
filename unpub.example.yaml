# Example unpub configuration. Copy to unpub.yaml and adjust.
#
# Every key can be overridden by an environment variable named
# UNPUB_<SECTION>_<KEY>, for example UNPUB_MONGO_URI, UNPUB_SERVER_PORT or
# UNPUB_STORAGE_S3_BUCKET. CamelCase keys take underscores: server.publicUrl is
# UNPUB_SERVER_PUBLIC_URL. Prefer the environment for secrets.

server:
  host: 0.0.0.0
  port: 4000
  # External URL of the server. Required behind a reverse proxy, because it
  # builds the archive and upload URLs given to `dart pub`. An origin only.
  # publicUrl: https://pub.example.com
  # Take the client address from the last entry of X-Forwarded-For. Enable it
  # only behind a reverse proxy that sets the header.
  # trustForwardedFor: false

mongo:
  # The database name is required.
  uri: mongodb://localhost:27017/dart_pub

storage:
  # file or s3
  type: file
  file:
    path: unpub-packages
  # Used when type is s3. Without accessKey and secretKey the credentials come
  # from AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, or the ECS task role.
  # s3:
  #   bucket: my-packages
  #   region: eu-west-1
  #   endpoint: s3.amazonaws.com  # host name only
  #   port: 9000
  #   useSSL: true
  #   pathStyle: false
  #   accessKey: ...
  #   secretKey: ...
  #   sessionToken: ...

upstream:
  # Packages not found locally redirect here.
  url: https://pub.dev

auth:
  # Creates this administrator when the server starts with no users. Ignored
  # once any user exists. Prefer UNPUB_AUTH_ADMIN_PASSWORD for the password.
  # admin:
  #   email: you@example.com
  #   password: at-least-8-characters
  # public: anyone can read. authenticated: every route except /healthz,
  # /readyz and login needs a token or session. The embedded web UI cannot
  # send tokens, so it does not work when authenticated.
  readAccess: public
  # Deprecated, use personal tokens from `unpub admin create-token`.
  # A static Bearer token that acts as an administrator with bootstrapEmail.
  # Allowed characters: a-z A-Z 0-9 . _ ~ + / = -
  # bootstrapToken: replace-with-a-long-random-token
  bootstrapEmail: admin@localhost
  # Deprecated. Static Bearer tokens that act as readers. As
  # UNPUB_AUTH_READ_TOKENS, separate them with commas.
  # readTokens:
  #   - replace-with-a-long-random-token

logging:
  # finest, finer, fine (debug), config, info, warning, severe (error), shout, off
  level: info
  # text or json
  format: text
