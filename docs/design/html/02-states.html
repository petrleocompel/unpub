<figure class="col gap-2"><figcaption class="section-h">Empty registry</figcaption>
<div class="state" style="background: var(--background);">
<span class="ic"><i class="i i-package"></i></span>
<h3>No packages yet</h3>
<p>Publish the first one from its directory. Add your token once, then publish:</p>
<div class="code w-full" style="text-align: left;"><pre><span class="pr">$ </span>dart pub token add https://pub.company.example
<span class="pr">$ </span>dart pub publish --server https://pub.company.example</pre><button class="btn btn-ghost btn-icon btn-sm copy" type="button" aria-label="Copy commands"><i class="i i-copy"></i></button></div>
<p class="t-xs">Or set <code class="inl">publish_to: https://pub.company.example</code> in pubspec.yaml.</p>
</div>
</figure>

<figure class="col gap-2"><figcaption class="section-h">No results</figcaption>
<div class="state" style="background: var(--background);">
<span class="ic"><i class="i i-search-x"></i></span>
<h3>Nothing matches “<span class="mono">blocc</span>”</h3>
<p>With the filters SDK: Flutter. Check the spelling, or search all SDKs.</p>
<div class="flex wrap justify-center gap-2"><button class="btn btn-outline btn-sm" type="button"><i class="i i-rotate"></i>Reset the search</button><button class="btn btn-ghost btn-sm" type="button">Search all SDKs</button></div>
</div>

<figure class="col gap-2"><figcaption class="section-h">Error with retry</figcaption>

<p class="t-xs mono">request 01JC9Z0K3V8N</p>
</div>
</figure>

<figure class="col gap-2"><figcaption class="section-h">403 · Forbidden</figcaption>

<figure class="col gap-2"><figcaption class="section-h">Dialog · delete package (type the name)</figcaption>

</div>
</div>

<figure class="col gap-2"><figcaption class="section-h">Dialog · rotate secret (tick to confirm)</figcaption>

</div>
</div>
</div>
